<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Primer</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 40px auto;
        max-width: 600px;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
      }
      .container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      h1 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
        margin-top: 0;
      }
      #demo {
        background-color: #f9f9f9;
        border-left: 4px solid #2ecc71;
        padding: 15px;
        font-style: italic;
        white-space: pre-line;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>JavaScript Pesma</h1>
      <p id="demo"></p>
    </div>

    <script>
      let poem = `Učim JavaScript iz dana u dan,
svaki novi kod je kao ostvaren san.
Od stringova i metoda sve do funkcija,
front-end razvoj je moja misija.`;

      document.getElementById("demo").innerHTML = poem;
    </script>
  </body>
</html>
